<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Little World ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; font-family: Georgia, 'Times New Roman', serif;
    color: #6b213c;
    background: radial-gradient(circle at top, #fff3f5, #f8d8e2 55%, #f4c5d5);
  }
  .card {
    width: min(100%, 680px); background: rgba(255,255,255,.92);
    border: 1px solid #f1c0d0; border-radius: 24px; padding: 28px;
    text-align: center; box-shadow: 0 18px 55px rgba(115, 35, 65, .16);
  }
  .heart { font-size: 36px; }
  h1 { margin: 8px 0; font-size: clamp(27px, 5vw, 40px); }
  p { line-height: 1.55; }
  input {
    width: 100%; max-width: 360px; padding: 14px 16px; margin: 10px 0;
    border: 1px solid #dfa2b7; border-radius: 12px; font-size: 16px;
  }
  button {
    border: 0; border-radius: 12px; padding: 13px 22px; cursor: pointer;
    color: white; background: #c44772; font-size: 16px;
  }
  button:hover { background: #a9335c; }
  #error { color: #b42342; min-height: 24px; }
  #photoArea { display: none; }
  #photoArea img {
    display: block; width: 100%; height: auto; margin: 20px auto 0;
    border-radius: 16px; box-shadow: 0 8px 25px rgba(80, 20, 45, .18);
  }
  .small { color: #8d5268; font-size: 14px; }
</style>
</head>
<body>
<main class="card">
  <div class="heart">💗 🔐 💗</div>
  <section id="lockArea">
    <h1>Our Little World</h1>
    <p>A little memory, just for us. Enter our secret password to open it. 🥰</p>
    <form id="unlockForm">
      <input id="password" type="password" placeholder="Enter our secret password" autocomplete="off" required aria-label="Secret password">
      <br>
      <button type="submit">Unlock our memory ❤️</button>
    </form>
    <p id="error" role="alert"></p>
    <p class="small">A tiny secret made with love ✨</p>
  </section>
